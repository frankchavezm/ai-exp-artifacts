<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    canvas { display: block; }

    #ui {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    #ui label {
      font-size: 13px;
      color: #aaa;
    }

    #speed-range {
      -webkit-appearance: none;
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    #speed-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f0a500;
      cursor: pointer;
    }

    #pause-btn {
      padding: 6px 14px;
      border: 1px solid #555;
      border-radius: 20px;
      background: transparent;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    #pause-btn:hover { background: #222; border-color: #f0a500; color: #f0a500; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(0,0,0,0.75);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
      z-index: 20;
      max-width: 180px;
    }

    #tooltip .name { font-weight: bold; font-size: 15px; color: #f0a500; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <label>Speed <span id="speed-val">1×</span></label>
  <input id="speed-range" type="range" min="0.1" max="10" step="0.1" value="1" />
  <button id="pause-btn">⏸ Pause</button>
</div>

<div id="tooltip">
  <div class="name" id="tip-name"></div>
  <div id="tip-info"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const tipName = document.getElementById('tip-name');
const tipInfo = document.getElementById('tip-info');
const speedRange = document.getElementById('speed-range');
const speedVal = document.getElementById('speed-val');
const pauseBtn = document.getElementById('pause-btn');

let W, H, cx, cy, scale;
let paused = false;
let speedMult = 1;
let t = 0; // global time in seconds
let stars = [];
let hoveredPlanet = null;
let mouseX = 0, mouseY = 0;

// --- Planet data ---
// period in Earth days, radius in AU (scaled visually), tilt for ring, color gradient stops
const SUN = {
  name: 'Sun',
  info: 'Diameter: 1,391,000 km<br>Type: G-type main-sequence star',
  baseRadius: 28,
  color: ['#fff7aa', '#ffdd44', '#ff8800'],
  glow: '#ff880066',
};

const PLANETS = [
  {
    name: 'Mercury',
    info: 'Orbital period: 88 days<br>Diameter: 4,879 km',
    orbitAU: 0.39,
    period: 88,
    radius: 3.5,
    color: ['#b5b5b5', '#888'],
    tilt: 0,
    ring: false,
  },
  {
    name: 'Venus',
    info: 'Orbital period: 225 days<br>Diameter: 12,104 km',
    orbitAU: 0.72,
    period: 225,
    radius: 5.5,
    color: ['#f5deb3', '#c8a060'],
    tilt: 0,
    ring: false,
  },
  {
    name: 'Earth',
    info: 'Orbital period: 365 days<br>Diameter: 12,742 km',
    orbitAU: 1.0,
    period: 365,
    radius: 6,
    color: ['#4fc3f7', '#1565c0', '#2e7d32'],
    tilt: 0,
    ring: false,
    moon: true,
  },
  {
    name: 'Mars',
    info: 'Orbital period: 687 days<br>Diameter: 6,779 km',
    orbitAU: 1.52,
    period: 687,
    radius: 4.5,
    color: ['#e57373', '#b71c1c'],
    tilt: 0,
    ring: false,
  },
  {
    name: 'Jupiter',
    info: 'Orbital period: 4,333 days<br>Diameter: 139,820 km',
    orbitAU: 2.4,
    period: 4333,
    radius: 14,
    color: ['#c8a97e', '#a0785a', '#e8c49a'],
    tilt: 0,
    ring: false,
    bands: true,
  },
  {
    name: 'Saturn',
    info: 'Orbital period: 10,759 days<br>Diameter: 116,460 km',
    orbitAU: 3.1,
    period: 10759,
    radius: 12,
    color: ['#e8d5a3', '#c8b06a'],
    tilt: 27,
    ring: true,
  },
  {
    name: 'Uranus',
    info: 'Orbital period: 30,687 days<br>Diameter: 50,724 km',
    orbitAU: 3.75,
    period: 30687,
    radius: 9,
    color: ['#7de8e8', '#4fc3c3'],
    tilt: 98,
    ring: true,
    thinRing: true,
  },
  {
    name: 'Neptune',
    info: 'Orbital period: 60,190 days<br>Diameter: 49,244 km',
    orbitAU: 4.35,
    period: 60190,
    radius: 8.5,
    color: ['#3f51b5', '#1a237e'],
    tilt: 0,
    ring: false,
  },
];

// --- Resize ---
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  // scale: map 4.5 AU to ~45% of min(W,H)
  scale = Math.min(W, H) * 0.45 / 4.5;
  generateStars();
}

function generateStars() {
  stars = [];
  const n = Math.floor((W * H) / 1800);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      twinkleSpeed: Math.random() * 2 + 0.5,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }
}

// --- Draw helpers ---
function drawStars(now) {
  for (const s of stars) {
    const alpha = s.a * (0.6 + 0.4 * Math.sin(now * s.twinkleSpeed + s.twinkleOffset));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function planetGrad(x, y, r, colors) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  if (colors.length === 2) {
    g.addColorStop(0, colors[0]);
    g.addColorStop(1, colors[1]);
  } else {
    g.addColorStop(0, colors[0]);
    g.addColorStop(0.5, colors[1]);
    g.addColorStop(1, colors[2]);
  }
  return g;
}

function drawOrbit(orbitPx) {
  ctx.beginPath();
  ctx.arc(cx, cy, orbitPx, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawSun(now) {
  const r = SUN.baseRadius;

  // outer glow layers
  for (let i = 4; i >= 1; i--) {
    const pulse = 1 + 0.04 * Math.sin(now * 1.5 + i);
    const gr = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * (2.5 + i * 0.8) * pulse);
    gr.addColorStop(0, `rgba(255,200,50,${0.06 / i})`);
    gr.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, r * (2.5 + i * 0.8) * pulse, 0, Math.PI * 2);
    ctx.fillStyle = gr;
    ctx.fill();
  }

  // surface
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#fffde7');
  g.addColorStop(0.4, '#ffee58');
  g.addColorStop(0.8, '#ffa000');
  g.addColorStop(1, '#e65100');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawJupiterBands(x, y, r) {
  const bands = [
    { y: 0.0, h: 0.15, color: 'rgba(180,140,100,0.5)' },
    { y: 0.2, h: 0.12, color: 'rgba(140,90,60,0.6)' },
    { y: 0.38, h: 0.1, color: 'rgba(200,170,120,0.4)' },
    { y: 0.55, h: 0.15, color: 'rgba(140,90,60,0.5)' },
    { y: 0.75, h: 0.1, color: 'rgba(180,140,100,0.4)' },
  ];
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  for (const b of bands) {
    const yOff = (b.y - 0.5) * 2 * r;
    const hPx = b.h * 2 * r;
    ctx.fillStyle = b.color;
    ctx.fillRect(x - r, y + yOff, r * 2, hPx);
  }
  // Great Red Spot
  ctx.beginPath();
  ctx.ellipse(x + r * 0.25, y + r * 0.2, r * 0.18, r * 0.1, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(180,60,30,0.5)';
  ctx.fill();
  ctx.restore();
}

function drawRing(x, y, r, tilt, thin) {
  ctx.save();
  ctx.translate(x, y);
  const tiltRad = (tilt * Math.PI) / 180;
  ctx.scale(1, Math.cos(tiltRad) * 0.35 + 0.05);

  const inner = thin ? r * 1.3 : r * 1.25;
  const outer = thin ? r * 1.7 : r * 2.1;
  const ringColors = thin
    ? ['rgba(150,200,200,0.15)', 'rgba(150,200,200,0.35)', 'rgba(150,200,200,0.1)']
    : ['rgba(200,180,120,0.1)', 'rgba(220,195,140,0.5)', 'rgba(200,180,120,0.15)'];

  const g = ctx.createRadialGradient(0, 0, inner, 0, 0, outer);
  g.addColorStop(0, ringColors[0]);
  g.addColorStop(0.5, ringColors[1]);
  g.addColorStop(1, ringColors[2]);

  ctx.beginPath();
  ctx.arc(0, 0, outer, 0, Math.PI * 2);
  ctx.arc(0, 0, inner, 0, Math.PI * 2, true);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.restore();
}

function drawMoon(px, py, earthRadius, angle) {
  const dist = earthRadius * 2.5;
  const mx = px + Math.cos(angle) * dist;
  const my = py + Math.sin(angle) * dist;
  const mr = 1.8;
  const g = ctx.createRadialGradient(mx - 0.5, my - 0.5, 0.3, mx, my, mr);
  g.addColorStop(0, '#ddd');
  g.addColorStop(1, '#888');
  ctx.beginPath();
  ctx.arc(mx, my, mr, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawLabel(name, x, y, r) {
  ctx.fillStyle = 'rgba(200,200,200,0.7)';
  ctx.font = `${Math.max(10, r * 0.9)}px Segoe UI`;
  ctx.textAlign = 'center';
  ctx.fillText(name, x, y + r + 14);
}

function drawPlanet(p, px, py, r, angle, now) {
  // ring behind planet (bottom half)
  if (p.ring) drawRing(px, py, r, p.tilt, p.thinRing);

  // planet sphere
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fillStyle = planetGrad(px, py, r, p.color);
  ctx.fill();

  // Jupiter bands
  if (p.bands) drawJupiterBands(px, py, r);

  // Earth clouds
  if (p.moon) {
    // slight cloud shimmer
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = `rgba(255,255,255,${0.08 + 0.04 * Math.sin(now * 0.3)})`;
    ctx.fillRect(px - r, py - r * 0.2, r * 2, r * 0.4);
    ctx.restore();

    // Moon
    const moonAngle = (now * 2) % (Math.PI * 2);
    drawMoon(px, py, r, moonAngle);
  }

  // specular highlight
  ctx.beginPath();
  ctx.arc(px - r * 0.3, py - r * 0.3, r * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();

  drawLabel(p.name, px, py, r);
}

// --- Animation state ---
const angles = PLANETS.map(() => Math.random() * Math.PI * 2);

function frame(ts) {
  const now = ts / 1000;
  if (!paused) t += (1 / 60) * speedMult;

  ctx.clearRect(0, 0, W, H);

  drawStars(now);
  drawSun(now);

  // orbit rings
  for (const p of PLANETS) {
    drawOrbit(p.orbitAU * scale);
  }

  // planets
  hoveredPlanet = null;
  const rendered = [];

  for (let i = 0; i < PLANETS.length; i++) {
    const p = PLANETS[i];
    const orbitPx = p.orbitAU * scale;
    // period in days → angular velocity: 2π / period (days), t in days equivalent
    const angle = angles[i] + (t / p.period) * Math.PI * 2;
    const px = cx + Math.cos(angle) * orbitPx;
    const py = cy + Math.sin(angle) * orbitPx;
    const r = p.radius;

    rendered.push({ p, px, py, r, angle });

    // hover detection
    const dx = mouseX - px, dy = mouseY - py;
    if (Math.sqrt(dx * dx + dy * dy) < r + 6) hoveredPlanet = { p, px, py };
  }

  for (const item of rendered) {
    drawPlanet(item.p, item.px, item.py, item.r, item.angle, t);
  }

  // Sun hover
  const sdx = mouseX - cx, sdy = mouseY - cy;
  if (Math.sqrt(sdx * sdx + sdy * sdy) < SUN.baseRadius + 6) {
    hoveredPlanet = { p: SUN, px: cx, py: cy };
  }

  updateTooltip();

  requestAnimationFrame(frame);
}

function updateTooltip() {
  if (hoveredPlanet) {
    tipName.textContent = hoveredPlanet.p.name;
    tipInfo.innerHTML = hoveredPlanet.p.info;
    tooltip.style.display = 'block';
    let tx = mouseX + 16, ty = mouseY - 10;
    if (tx + 190 > W) tx = mouseX - 200;
    if (ty + 80 > H) ty = mouseY - 80;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
}

// --- Controls ---
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mouseleave', () => {
  mouseX = -9999;
  mouseY = -9999;
});

speedRange.addEventListener('input', () => {
  speedMult = parseFloat(speedRange.value);
  speedVal.textContent = speedMult.toFixed(1) + '×';
});

pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
});

// --- Init ---
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
