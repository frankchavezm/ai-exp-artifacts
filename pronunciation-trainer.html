<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PronounceIt — English Pronunciation Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
    .nav-stats { display: flex; gap: 12px; }
    .stat-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-badge .val { color: var(--text); font-weight: 600; }

    /* ── Layout ── */
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px; }

    /* ── Buttons ── */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-primary:not(:disabled):hover { background: #79c0ff; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:not(:disabled):hover { background: #2d333b; border-color: #6e7681; }
    .btn-lg { padding: 14px 28px; font-size: 16px; border-radius: 10px; }
    .btn-sm { padding: 6px 13px; font-size: 13px; }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Home ── */
    .home-header { text-align: center; margin-bottom: 40px; }
    .home-header h1 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .home-header p { font-size: 15px; color: var(--text-dim); max-width: 460px; margin: 0 auto; }

    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }

    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--cat-color, var(--accent));
    }
    .cat-card:hover { border-color: var(--cat-color, var(--accent)); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .cat-icon { font-size: 30px; margin-bottom: 10px; }
    .cat-name { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
    .cat-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.4; }
    .cat-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; }
    .cat-meta span { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; }

    /* ── Progress bar ── */
    .progress-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .progress-bar-wrap { flex: 1; background: var(--surface2); border-radius: 100px; height: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 100px; transition: width 0.4s ease; }
    .progress-label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

    /* ── Cat header bar ── */
    .cat-header-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cat-color-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cat-color, var(--accent)); flex-shrink: 0; }
    .cat-header-name { font-weight: 600; font-size: 15px; }
    .cat-tip { margin-left: auto; font-size: 13px; color: var(--text-dim); }

    /* ── Mode select ── */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .mode-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .mode-card:hover { border-color: var(--cat-color, var(--accent)); transform: translateY(-2px); }
    .mode-icon { font-size: 36px; margin-bottom: 12px; }
    .mode-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .mode-card p { font-size: 13px; color: var(--text-dim); }

    /* ── Word card ── */
    .word-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--cat-color, var(--accent));
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      margin-bottom: 20px;
    }
    .word-display { font-size: 52px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; line-height: 1.1; }
    .ipa-display { font-size: 19px; color: var(--text-dim); margin-bottom: 20px; font-style: italic; }
    .example-sentence {
      font-size: 15px;
      color: var(--text-dim);
      font-style: italic;
      padding: 14px 18px;
      background: var(--surface2);
      border-radius: 10px;
      border-left: 3px solid var(--cat-color, var(--accent));
      text-align: left;
    }

    /* ── Action row ── */
    .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }

    /* ── Record button ── */
    .record-btn {
      background: var(--surface2);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 15px 32px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto 20px;
    }
    .record-btn:hover { border-color: var(--red); color: var(--red); }
    .record-btn.recording {
      background: rgba(248,81,73,0.08);
      border-color: var(--red);
      color: var(--red);
      animation: pulse-ring 1.1s infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0.3); }
      50% { box-shadow: 0 0 0 10px rgba(248,81,73,0); }
    }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .recording .rec-dot { animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

    /* Waveform */
    .waveform { display: flex; align-items: center; gap: 3px; height: 22px; }
    .wb { width: 3px; background: var(--red); border-radius: 2px; animation: wv 0.9s infinite ease-in-out; }
    .wb:nth-child(1) { animation-delay: 0.0s; }
    .wb:nth-child(2) { animation-delay: 0.15s; }
    .wb:nth-child(3) { animation-delay: 0.3s; }
    .wb:nth-child(4) { animation-delay: 0.15s; }
    .wb:nth-child(5) { animation-delay: 0.0s; }
    @keyframes wv {
      0%, 100% { height: 5px; }
      50% { height: 20px; }
    }

    /* ── Feedback ── */
    .feedback-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 20px;
      display: none;
    }
    .feedback-panel.show { display: block; }
    .feedback-result { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .result-icon { font-size: 28px; }
    .result-text h3 { font-size: 16px; margin-bottom: 2px; }
    .result-text p { font-size: 13px; color: var(--text-dim); }
    .score-bar-wrap { margin-bottom: 12px; }
    .score-bar-label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .score-bar { height: 8px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 100px; transition: width 0.6s ease; }
    .compare-row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 6px; }
    .compare-label { color: var(--text-dim); width: 68px; }
    .compare-val { font-weight: 600; }
    .compare-match { color: var(--green); }
    .compare-miss { color: var(--red); }

    /* ── Nav row ── */
    .nav-row { display: flex; justify-content: space-between; align-items: center; }

    /* ── Results ── */
    .results-header { text-align: center; margin-bottom: 32px; }
    .big-score { font-size: 72px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
    .big-score.good { color: var(--green); }
    .big-score.ok { color: var(--orange); }
    .big-score.bad { color: var(--red); }
    .results-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .result-item.ri-correct { border-left: 3px solid var(--green); }
    .result-item.ri-partial { border-left: 3px solid var(--orange); }
    .result-item.ri-wrong { border-left: 3px solid var(--red); }
    .ri-icon { font-size: 18px; width: 24px; text-align: center; }
    .ri-word { font-weight: 700; font-size: 15px; flex: 1; }
    .ri-heard { font-size: 13px; color: var(--text-dim); font-style: italic; flex: 1.5; }
    .ri-score { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ── Warning ── */
    .warning-box {
      background: rgba(210,153,34,0.08);
      border: 1px solid rgba(210,153,34,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--orange);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 200;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 580px) {
      .word-display { font-size: 38px; }
      .mode-grid { grid-template-columns: 1fr; }
      .home-header h1 { font-size: 26px; }
      .cat-tip { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">🎙️ PronounceIt</div>
  <div class="nav-stats">
    <div class="stat-badge">✅ <span class="val" id="nav-correct">0</span></div>
    <div class="stat-badge">🔥 <span class="val" id="nav-streak">0</span> streak</div>
  </div>
</nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────

const categories = [

      { word: 'fool', ipa: '/fuːl/', example: 'Do not be a fool.' },
      { word: 'pull', ipa: '/pʊl/',  example: 'Pull the door open.' },
      { word: 'pool', ipa: '/puːl/', example: 'Let us swim in the pool.' },
    ]
  },
  {
    id: 'rl', name: 'R vs L', icon: '🔀', color: '#43b89c',
    description: 'Tell apart the R and L sounds clearly',
    tip: 'R: curl tongue back. L: tongue tip touches roof of mouth',
    words: [
      { word: 'right', ipa: '/raɪt/', example: 'Turn right at the corner.' },
      { word: 'light', ipa: '/laɪt/', example: 'Please switch on the light.' },
      { word: 'road',  ipa: '/roʊd/', example: 'The road was icy.' },
      { word: 'load',  ipa: '/loʊd/', example: 'The truck carried a heavy load.' },
      { word: 'rice',  ipa: '/raɪs/', example: 'I love fried rice.' },
      { word: 'lice',  ipa: '/laɪs/', example: 'Head lice spread quickly.' },
      { word: 'red',   ipa: '/rɛd/',  example: 'She wore a red dress.' },
      { word: 'led',   ipa: '/lɛd/',  example: 'She led the team to victory.' },
    ]
  },
  {
    id: 'vw', name: 'V vs W', icon: '💨', color: '#f7a44a',

    tip: 'V: upper teeth touch lower lip. W: round lips, no teeth',
    words: [
      { word: 'very', ipa: '/ˈvɛri/', example: 'That is a very good idea.' },
      { word: 'wary', ipa: '/ˈwɛri/', example: 'Be wary of strangers online.' },
      { word: 'vine', ipa: '/vaɪn/',  example: 'The vine climbed the wall.' },
      { word: 'wine', ipa: '/waɪn/',  example: 'Would you like some wine?' },
      { word: 'vest', ipa: '/vɛst/',  example: 'He wore a yellow vest.' },
      { word: 'west', ipa: '/wɛst/',  example: 'The sun sets in the west.' },
      { word: 'vent', ipa: '/vɛnt/',  example: 'Open the vent for air.' },
      { word: 'went', ipa: '/wɛnt/',  example: 'She went to the store.' },
    ]
  },
  {
    id: 'silent', name: 'Silent Letters', icon: '🤫', color: '#9b59b6',
    description: 'Letters that are written but never spoken',
    tip: 'Many English words have silent letters — memorise the patterns',
    words: [
      { word: 'knight',  ipa: '/naɪt/',      example: 'The knight rode into battle.' },
      { word: 'write',   ipa: '/raɪt/',      example: 'Please write your name.' },
      { word: 'know',    ipa: '/noʊ/',       example: 'I know the answer.' },
      { word: 'knife',   ipa: '/naɪf/',      example: 'Be careful with that knife.' },
      { word: 'hour',    ipa: '/aʊər/',      example: 'The class lasts one hour.' },
      { word: 'honest',  ipa: '/ˈɒnɪst/',   example: 'He was always honest.' },
      { word: 'island',  ipa: '/ˈaɪlənd/',  example: 'They own a tropical island.' },

  {

    description: 'Stress the right syllable for natural speech',

    words: [
      { word: 'important',    ipa: '/ɪmˈpɔːrtənt/',   example: 'It is important to stay healthy.' },
      { word: 'beautiful',    ipa: '/ˈbjuːtɪfəl/',    example: 'What a beautiful day!' },
      { word: 'comfortable',  ipa: '/ˈkʌmftəbəl/',    example: 'This chair is very comfortable.' },
      { word: 'interesting',  ipa: '/ˈɪntrɪstɪŋ/',   example: 'That was an interesting lecture.' },
      { word: 'photography',  ipa: '/fəˈtɒɡrəfi/',    example: 'She studied photography in college.' },
      { word: 'necessary',    ipa: '/ˈnɛsɪsɛri/',     example: 'Is it necessary to attend?' },
      { word: 'education',    ipa: '/ˌɛdjʊˈkeɪʃən/', example: 'Education opens many doors.' },

    words: [
      { word: 'She sells seashells',       ipa: '/ʃiː sɛlz ˈsiːʃɛlz/',         example: 'She sells seashells by the seashore.' },
      { word: 'Peter Piper',               ipa: '/ˈpiːtər ˈpaɪpər/',            example: 'Peter Piper picked a peck of pickled peppers.' },
      { word: 'How much wood',             ipa: '/haʊ mʌtʃ wʊd/',               example: 'How much wood would a woodchuck chuck?' },
      { word: 'Red lorry yellow lorry',    ipa: '/rɛd ˈlɒri ˈjɛloʊ ˈlɒri/',    example: 'Red lorry, yellow lorry, red lorry, yellow lorry.' },
      { word: 'Unique New York',           ipa: '/juːˈniːk njuː jɔːrk/',        example: 'Unique New York, unique New York, you know you need unique New York.' },

      { word: 'Fresh French fried fish',   ipa: '/frɛʃ frɛntʃ fraɪd fɪʃ/',     example: 'Fresh French fried fish, fresh French fried fish.' },
    ]
  },
];

// ── State ────────────────────────────────────────────────────────────────────

const st = {
  view: 'home',
  category: null,
  wordIndex: 0,
  mode: 'practice',
  session: { total: 0, correct: 0, results: [] },
  global: { correct: 0, streak: 0 },
  recognizing: false,
};

// ── Speech ───────────────────────────────────────────────────────────────────

const synth = window.speechSynthesis;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;

if (SR) {
  recog = new SR();
  recog.continuous = false;
  recog.interimResults = false;
  recog.lang = 'en-US';
}

function speak(text, rate = 0.88) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate; u.pitch = 1;
  synth.speak(u);
}

// ── Levenshtein similarity ────────────────────────────────────────────────────

function lev(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => j === 0 ? i : 0));
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = a[i-1] === b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j], d[i][j-1], d[i-1][j-1]);
  return d[m][n];
}

function scoreSimilarity(expected, heard) {
  const a = expected.toLowerCase().replace(/[^a-z\s]/g, '').trim();
  const b = heard.toLowerCase().replace(/[^a-z\s]/g, '').trim();
  if (b.includes(a)) return 100;
  const aWords = a.split(/\s+/);
  if (aWords.length === 1) {
    let best = 0;
    for (const w of b.split(/\s+/)) {
      const mx = Math.max(a.length, w.length);
      if (mx) best = Math.max(best, Math.round((1 - lev(a, w) / mx) * 100));
    }
    return best;
  }
  const mx = Math.max(a.length, b.length);
  return mx ? Math.round((1 - lev(a, b) / mx) * 100) : 0;
}

// ── Toast ────────────────────────────────────────────────────────────────────

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Render ───────────────────────────────────────────────────────────────────

const mainEl = document.getElementById('main');

function render() {
  document.getElementById('nav-correct').textContent = st.global.correct;
  document.getElementById('nav-streak').textContent = st.global.streak;
  const views = { home: renderHome, 'mode-select': renderModeSelect, practice: renderPractice, test: renderTest, results: renderResults };
  views[st.view]?.();
}

// HOME ────────────────────────────────────────────────────────────────────────

function renderHome() {
  mainEl.innerHTML = `
    <div class="home-header">
      <h1>Improve Your English Pronunciation</h1>
      <p>Practice individual sounds with audio examples and instant speech recognition feedback.</p>
    </div>
    ${!SR ? `<div class="warning-box"><span>⚠️</span><div>Speech recognition works in <strong>Chrome or Edge</strong>. You can still listen to examples, but mic feedback won't be available in this browser.</div></div>` : ''}
    <div class="category-grid">
      ${categories.map(c => `
        <div class="cat-card" style="--cat-color:${c.color}" onclick="selectCat('${c.id}')">
          <div class="cat-icon">${c.icon}</div>
          <div class="cat-name">${c.name}</div>
          <div class="cat-desc">${c.description}</div>
          <div class="cat-meta"><span>${c.words.length} words</span><span style="color:${c.color}">▶ Start</span></div>
        </div>
      `).join('')}
    </div>`;
}

// MODE SELECT ─────────────────────────────────────────────────────────────────

function renderModeSelect() {
  const c = st.category;
  mainEl.innerHTML = `
    <div class="progress-header">
      <button class="back-btn" onclick="goHome()">← Back</button>
    </div>
    <div class="cat-header-bar" style="--cat-color:${c.color}">
      <div class="cat-color-dot"></div>
      <div class="cat-header-name">${c.icon} ${c.name}</div>
      <div class="cat-tip">💡 ${c.tip}</div>
    </div>
    <div class="mode-grid" style="--cat-color:${c.color}">
      <div class="mode-card" onclick="startPractice()">
        <div class="mode-icon">📖</div>
        <h3>Practice Mode</h3>
        <p>Browse each word, hear the pronunciation, and get mic feedback at your own pace.</p>
      </div>
      <div class="mode-card" onclick="startTest()">
        <div class="mode-icon">🎯</div>
        <h3>Test Mode</h3>
        <p>Pronounce all ${c.words.length} words and receive a final score with a full breakdown.</p>
      </div>
    </div>`;
}

// PRACTICE ────────────────────────────────────────────────────────────────────

function renderPractice() {
  const c = st.category;
  const w = c.words[st.wordIndex];
  const total = c.words.length;
  const pct = (st.wordIndex / total * 100).toFixed(1);
  const esc = s => s.replace(/'/g, "\\'");

  mainEl.innerHTML = `
    <div class="progress-header">
      <button class="back-btn" onclick="goModeSelect()">← Back</button>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <div class="progress-label">${st.wordIndex + 1} / ${total}</div>
    </div>
    <div class="cat-header-bar" style="--cat-color:${c.color}">
      <div class="cat-color-dot"></div>
      <div class="cat-header-name">${c.icon} ${c.name}</div>
      <div class="cat-tip">💡 ${c.tip}</div>
    </div>
    <div class="word-card" style="--cat-color:${c.color}">
      <div class="word-display">${w.word}</div>
      <div class="ipa-display">${w.ipa}</div>
      <div class="example-sentence">"${w.example}"</div>
    </div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="speak('${esc(w.word)}')">🔊 Listen</button>
      <button class="btn btn-secondary" onclick="speak('${esc(w.word)}', 0.55)">🐢 Slow</button>
      <button class="btn btn-secondary btn-sm" onclick="speak('${esc(w.example)}')">💬 Sentence</button>
    </div>
    ${SR
      ? `<button class="record-btn" id="rbtn" onclick="toggleRec('${esc(w.word)}', false)">
           <div class="rec-dot"></div><span id="rlabel">🎤 Tap to speak</span>
         </button>`
      : `<div class="warning-box" style="margin-bottom:20px"><span>ℹ️</span><div>Use Chrome or Edge for mic feedback.</div></div>`
    }
    <div class="feedback-panel" id="fp"></div>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prevWord()" ${st.wordIndex === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn btn-primary" onclick="nextWord()">${st.wordIndex < total - 1 ? 'Next →' : '🏁 Done'}</button>
    </div>`;
}

// TEST ────────────────────────────────────────────────────────────────────────

function renderTest() {
  const c = st.category;
  const w = c.words[st.wordIndex];
  const total = c.words.length;
  const pct = (st.wordIndex / total * 100).toFixed(1);
  const esc = s => s.replace(/'/g, "\\'");

  mainEl.innerHTML = `
    <div class="progress-header">
      <button class="back-btn" onclick="goModeSelect()">✕ Exit Test</button>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <div class="progress-label">${st.wordIndex + 1} / ${total} · ${st.session.correct} ✅</div>
    </div>
    <div class="cat-header-bar" style="--cat-color:${c.color}">
      <div class="cat-color-dot"></div>
      <div class="cat-header-name">🎯 Test: ${c.name}</div>
    </div>
    <div class="word-card" style="--cat-color:${c.color}">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">Say this word clearly:</div>
      <div class="word-display">${w.word}</div>
      <div class="ipa-display">${w.ipa}</div>
    </div>
    <div class="action-row">
      <button class="btn btn-secondary btn-sm" onclick="speak('${esc(w.word)}')">🔊 Hear it first</button>
    </div>
    ${SR
      ? `<button class="record-btn" id="rbtn" onclick="toggleRec('${esc(w.word)}', true)">
           <div class="rec-dot"></div><span id="rlabel">🎤 Tap to speak</span>
         </button>`
      : `<div class="warning-box" style="margin-bottom:20px"><span>ℹ️</span><div>Use Chrome or Edge for mic feedback.</div></div>
         <div class="nav-row"><div></div><button class="btn btn-primary" onclick="advanceTest()">Skip →</button></div>`
    }
    <div class="feedback-panel" id="fp"></div>`;
}

// RESULTS ─────────────────────────────────────────────────────────────────────

function renderResults() {
  const c = st.category;
  const { correct, total, results } = st.session;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const grade = pct >= 80 ? 'good' : pct >= 50 ? 'ok' : 'bad';
  const msg = pct >= 80 ? '🌟 Excellent work!' : pct >= 50 ? '👍 Good effort — keep going!' : '💪 Practice makes perfect!';

  mainEl.innerHTML = `
    <div class="progress-header">
      <button class="back-btn" onclick="goHome()">← Home</button>
    </div>
    <div class="results-header">
      <div class="big-score ${grade}">${pct}%</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">${msg}</div>
      <div style="color:var(--text-dim);font-size:14px">${correct} correct out of ${total} · <em>${c.name}</em></div>
    </div>
    <div class="results-list">
      ${results.map(r => {
        const cls = r.score >= 80 ? 'ri-correct' : r.score >= 50 ? 'ri-partial' : 'ri-wrong';
        const icon = r.score >= 80 ? '✅' : r.score >= 50 ? '🟡' : '❌';
        const col = r.score >= 80 ? 'var(--green)' : r.score >= 50 ? 'var(--orange)' : 'var(--red)';
        return `<div class="result-item ${cls}">
          <div class="ri-icon">${icon}</div>
          <div class="ri-word">${r.word}</div>
          <div class="ri-heard">"${r.heard}"</div>
          <div class="ri-score" style="color:${col}">${r.score}%</div>
        </div>`;
      }).join('')}
    </div>
    <div class="action-row">
      <button class="btn btn-secondary btn-lg" onclick="startTest()">🔄 Try Again</button>
      <button class="btn btn-primary btn-lg" onclick="goHome()">🏠 Home</button>
    </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

function selectCat(id) {
  st.category = categories.find(c => c.id === id);
  st.view = 'mode-select';
  render();
}

function goHome() {
  synth.cancel();
  recog?.abort();
  st.recognizing = false;
  st.view = 'home';
  render();
}

function goModeSelect() {
  synth.cancel();
  recog?.abort();
  st.recognizing = false;
  st.view = 'mode-select';
  render();
}

function startPractice() {
  st.mode = 'practice';
  st.wordIndex = 0;
  st.view = 'practice';
  render();
}

function startTest() {
  st.mode = 'test';
  st.wordIndex = 0;
  st.session = { total: 0, correct: 0, results: [] };
  st.view = 'test';
  render();
}

function prevWord() {
  if (st.wordIndex > 0) { st.wordIndex--; render(); }
}

function nextWord() {
  if (st.wordIndex < st.category.words.length - 1) {
    st.wordIndex++;
    render();
  } else {
    goHome();
    toast('Practice complete! Great work 🎉');
  }
}

function advanceTest() {
  if (st.wordIndex < st.category.words.length - 1) {
    st.wordIndex++;
    render();
  } else {
    st.view = 'results';
    render();
  }
}

// ── Recording ────────────────────────────────────────────────────────────────

function toggleRec(expectedWord, isTest) {
  if (st.recognizing) { recog.stop(); return; }
  if (!recog) return;

  const btn = document.getElementById('rbtn');
  const lbl = document.getElementById('rlabel');

  recog.onstart = () => {
    st.recognizing = true;
    btn.classList.add('recording');
    lbl.innerHTML = `<div class="waveform">${'<div class="wb"></div>'.repeat(5)}</div>&nbsp;Listening…`;
  };

  recog.onresult = e => {
    const heard = e.results[0][0].transcript.trim();
    const score = scoreSimilarity(expectedWord, heard);
    showFeedback(expectedWord, heard, score, isTest);
    if (isTest) {
      st.session.total++;
      if (score >= 65) st.session.correct++;
      st.session.results.push({ word: expectedWord, heard, score });
    }
    if (score >= 65) { st.global.correct++; st.global.streak++; }
    else { st.global.streak = 0; }
    document.getElementById('nav-correct').textContent = st.global.correct;
    document.getElementById('nav-streak').textContent = st.global.streak;
  };

  recog.onerror = e => {
    st.recognizing = false;
    const b = document.getElementById('rbtn');
    const l = document.getElementById('rlabel');
    if (b) b.classList.remove('recording');
    if (l) l.textContent = '🎤 Tap to speak';
    if (e.error !== 'aborted') toast('Could not hear you — try again.');
  };

  recog.onend = () => {
    st.recognizing = false;
    const b = document.getElementById('rbtn');
    const l = document.getElementById('rlabel');
    if (b) b.classList.remove('recording');
    if (l) l.textContent = '🎤 Tap to speak';
  };

  recog.start();
}

function showFeedback(expected, heard, score, isTest) {
  const panel = document.getElementById('fp');
  if (!panel) return;

  let icon, title, sub, color;
  if (score >= 85)      { icon = '🎉'; title = 'Excellent!';     sub = 'Spot-on pronunciation.';               color = 'var(--green)'; }
  else if (score >= 65) { icon = '👍'; title = 'Pretty good!';   sub = 'Almost perfect — keep it up.';         color = 'var(--green)'; }
  else if (score >= 40) { icon = '🤔'; title = 'Almost there';   sub = 'Try focusing on the highlighted sound.'; color = 'var(--orange)'; }
  else                  { icon = '💪'; title = 'Keep trying!';   sub = 'Listen to the example carefully.';     color = 'var(--red)'; }

  panel.className = 'feedback-panel show';
  panel.innerHTML = `
    <div class="feedback-result">
      <div class="result-icon">${icon}</div>
      <div class="result-text">
        <h3 style="color:${color}">${title}</h3>
        <p>${sub}</p>
      </div>
    </div>
    <div class="score-bar-wrap">
      <div class="score-bar-label"><span>Match score</span><span style="color:${color};font-weight:700">${score}%</span></div>
      <div class="score-bar"><div class="score-bar-fill" style="width:${score}%;background:${color}"></div></div>
    </div>
    <div class="compare-row">
      <span class="compare-label">Expected:</span>
      <span class="compare-val compare-match">${expected}</span>
    </div>
    <div class="compare-row">
      <span class="compare-label">Heard:</span>
      <span class="compare-val ${score >= 65 ? 'compare-match' : 'compare-miss'}">"${heard}"</span>
    </div>
    ${isTest ? `<div style="text-align:right;margin-top:16px">
      <button class="btn btn-primary" onclick="advanceTest()">${st.wordIndex < st.category.words.length - 1 ? 'Next →' : '📊 See Results'}</button>
    </div>` : ''}`;
}

// ── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
